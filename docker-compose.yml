# Local dependencies for Unified MCP Studio (see docs/DEPLOYMENT.md, TASKS.md Phase 0).
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mcpstudio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mcpstudio}
      POSTGRES_DB: ${POSTGRES_DB:-mcpstudio}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mcpstudio} -d ${POSTGRES_DB:-mcpstudio}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
