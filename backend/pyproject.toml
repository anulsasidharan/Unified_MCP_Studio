[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-mcp-studio-api"
version = "0.1.0"
description = "Unified MCP Studio — FastAPI backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic-settings>=2.4,<3",
    "pydantic[email]>=2.9,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29,<1",
    "alembic>=1.14,<2",
    "bcrypt>=4.2,<5",
    "python-jose[cryptography]>=3.3,<4",
    "jinja2>=3.1,<4",
    "jsonschema>=4.23,<5",
    "celery[redis]>=5.4,<6",
    "redis>=5,<6",
]

[project.optional-dependencies]
gcp = [
    "google-cloud-storage>=2.18,<3",
]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8,<1",
    "psycopg2-binary>=2.9,<3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
